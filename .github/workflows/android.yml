name: Build Android APK

# Produces an installable APK without anyone needing Android Studio locally:
# GitHub's Linux runners ship the Android SDK and build tools already.
#
# Run it from the Actions tab → "Build Android APK" → Run workflow, then
# download the APK from the run's Artifacts section. Manual only, so it does
# not run on every push to the site.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        type: choice
        default: debug
        options: [debug, release]

permissions:
  contents: write  # needed to publish the APK as a release asset

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's CLI requires Node >= 22 — the Pages workflow's Node 20
      # is fine for Next but makes `cap sync` refuse to run.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor's Android project targets JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # NOTE: deliberately NOT the Pages build. That one prefixes every asset
      # with /shrenik-portfolio, a path that does not exist inside the app's
      # webview, and would ship a blank screen. app:build clears the basePath.
      - name: Build web assets for the app
        run: npm run app:build

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Assemble ${{ inputs.variant }} APK
        working-directory: android
        run: ./gradlew assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }} --no-daemon

      # A release APK is unsigned here — signing needs your own upload key,
      # which should not live in the repo. The debug APK is signed with the
      # standard debug key and installs on any device with unknown sources
      # enabled.
      - name: Collect the APK
        id: collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "built: $APK"
          cp "$APK" "dist/shrenik-yd-$VERSION-${{ inputs.variant }}.apk"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: shrenik-yd-${{ inputs.variant }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Artifacts require a signed-in GitHub account and arrive as a zip.
      # A release asset is a plain public link that works on a phone, which
      # is how anyone actually installs this.
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: v${{ steps.collect.outputs.version }}
          body: |
            Android app for the portfolio, built from `${{ github.sha }}`.

            Download the `.apk` below on your phone and open it. Android will
            ask you to allow installs from unknown sources, because this is
            signed with the standard debug key rather than a Play Store one.

            The web version lives at https://shrenikyd.github.io/shrenik-portfolio/
          files: dist/*.apk
          fail_on_unmatched_files: true
